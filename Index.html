<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificaciones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <aside class="panel formulario">
      <center><h2>Registrar Alumno</h2></center>
      <center><p class="subtitulo">Ingresa las calificaciones del 0 al 10</p></center> 

      <form id="form-calificaciones">
        <div class="campo">
          <label for="nombre">Nombre del estudiante:</label>
          <input type="text" id="nombre" placeholder="Ej. Carlos Hernández" required>
        </div>

        <div class="materias">
          <div class="campo">
            <label for="matematicas">Matemáticas:</label>
            <input type="number" id="matematicas" min="0" max="10" step="0.1" required>
          </div>
          <div class="campo">
            <label for="espanol">Español:</label>
            <input type="number" id="espanol" min="0" max="10" step="0.1" required>
          </div>
          <div class="campo">
            <label for="historia">Historia:</label>
            <input type="number" id="historia" min="0" max="10" step="0.1" required>
          </div>
        </div>

        <button type="submit" class="btn-guardar">Guardar Calificaciones</button>
      </form>
    </aside>
    <main class="panel resultados">
      <div class="encabezado-resultados">
        <h2>Historial de Registros</h2>
        <button id="btn-limpiar" class="btn-limpiar">Vaciar todo</button>
      </div>

      <div id="lista-alumnos">
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
